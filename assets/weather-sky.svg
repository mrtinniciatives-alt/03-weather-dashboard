<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Blue sky with clouds">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#79a8d4"/>
      <stop offset="0.58" stop-color="#a9c9df"/>
      <stop offset="1" stop-color="#d8dfd4"/>
    </linearGradient>
    <radialGradient id="sun">
      <stop offset="0" stop-color="#fff9bd" stop-opacity="1"/>
      <stop offset="0.35" stop-color="#ffe680" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffe680" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1250" cy="190" r="220" fill="url(#sun)"/>
  <g fill="#fff" opacity="0.78" filter="url(#blur)">
    <ellipse cx="280" cy="260" rx="210" ry="85"/><ellipse cx="470" cy="235" rx="230" ry="105"/>
    <ellipse cx="1080" cy="520" rx="240" ry="100"/><ellipse cx="1270" cy="500" rx="210" ry="110"/><ellipse cx="1450" cy="530" rx="180" ry="95"/>
    <ellipse cx="650" cy="700" rx="180" ry="65"/><ellipse cx="820" cy="680" rx="240" ry="95"/>
  </g>
</svg>
